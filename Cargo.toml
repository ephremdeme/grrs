[package]
name = "grrs"
version = "0.1.0"
edition = "2024"
authors = ["Ephrem <ephrem.dev>"]

[lib]
name = "grrs"
path = "src/lib.rs"

[[bin]]
name = "grrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"